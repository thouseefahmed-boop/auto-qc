name: autoqc-minivet
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autoqc
      POSTGRES_DB: autoqc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generated by deploy/minivet.py}
    volumes: ["autoqc_pg:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoqc -d autoqc"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: autoqc:minivet-source-images-20261014-3
    build:
      context: .
      dockerfile: Dockerfile.minivet
    environment:
      DATABASE_URL: postgresql://autoqc:${POSTGRES_PASSWORD}@db:5432/autoqc
      AUTOQC_WORKER_TOKEN: ${AUTOQC_WORKER_TOKEN:?Generated by deploy/minivet.py}
      AUTOQC_PUBLIC_BASE_URL: http://rtx-3.dev.internal:8810
      ARTIFACTS_BASE: http://rtx-1.dev.internal:8090/artifacts-service
      ARTIFACT_TENANT: Flipkart
    ports: ["8810:8810"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8810/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
  cosmos-worker:
    image: autoqc:minivet-source-images-20261014-3
    command: ["python", "worker_client.py", "--url", "http://api:8810", "--adapter", "autoqc.alfred_worker:infer", "--models", "cosmos4fps", "--worker-id", "autoqc-cosmos-rtx3-gpu2"]
    environment:
      AUTOQC_WORKER_TOKEN: ${AUTOQC_WORKER_TOKEN:?Generated by deploy/minivet.py}
      AUTOQC_LLM_PRIORITY: experimental
      AUTOQC_LLM_TIMEOUT: "900"
      NVIDIA_VISIBLE_DEVICES: ${AUTOQC_GPU_UUID:?Detected by deploy/minivet.py}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUTOQC_GPU_UUID}"]
              capabilities: [gpu]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  autoqc_pg:
