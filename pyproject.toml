[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoqc"
version = "0.1.0"
description = "Four-table video AutoQC benchmark workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.27,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
autoqc = ["schema.sql", "web/*"]

[tool.setuptools.packages.find]
include = ["autoqc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
